name: Bug Report
description: Report a problem with relic.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: relic version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command used
      description: Redact server names, domain names, and credentials.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
